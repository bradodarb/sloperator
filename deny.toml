# deny.toml (NFR-7)
[licenses]
allow = ["MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause", "ISC",
         "Unicode-3.0", "Zlib", "CDLA-Permissive-2.0"]
confidence-threshold = 0.9
# option-ext (MPL-2.0, file-level copyleft) arrives through dirs 7.0.0 -> dirs-sys. It is used unmodified, so MPL-2.0
# obligations are not triggered. A per-crate exception, not an allow-list entry: the list stays permissive-only.
# SPEC §2 says to replace a non-permissive dependency; replacing `dirs` is a decision for the story that uses it.
exceptions = [{ crate = "option-ext", allow = ["MPL-2.0"] }]
[bans]
multiple-versions = "warn"
wildcards = "deny"
[advisories]
yanked = "deny"
[sources]
unknown-registry = "deny"
unknown-git = "deny"
